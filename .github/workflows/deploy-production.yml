name: Deploy a Producción

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Ejecutar tests backend
        working-directory: ./backend
        run: |
          npm ci
          npm test -- --forceExit
        env:
          NODE_ENV: test

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Build Backend
        working-directory: ./backend
        run: |
          npm ci --only=production
          echo "✅ Backend listo para producción"

      - name: Build Frontend
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.PRODUCTION_API_URL }}

      - name: Crear artifact
        uses: actions/upload-artifact@v5
        with:
          name: production-build
          path: |
            backend/
            Frontend/dist/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Manual deployment
        run: |
          echo "⚠️  Production Deploy is configured for manual trigger"
          echo "Use Vercel or Heroku dashboard directly for deployment"
          echo "If deploying via Git: git push vercel/heroku from local"
