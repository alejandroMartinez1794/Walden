name: Tests

on:
  push:
    branches: [main, basileia, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        node-version: [20.x]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Instalar dependencias
        run: npm ci
      - name: Hotfix gopd para runner Linux
        run: npm install gopd@1.1.0 --no-save
      - name: Ejecutar tests
        run: npm test -- --forceExit --detectOpenHandles
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_TEST || 'mongodb://localhost:27017/basileia-test' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'test-secret-key-for-ci' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'test-encryption-key-32-bytes-long!!' }}
      - name: Generar reporte de cobertura
        # Reuse the clinical Jest config: the default config applies a stale 70% global gate
        # to the entire legacy backend and tries to instrument non-JS Mongo init files.
        # Clinical Testing Pipeline owns domain-specific coverage validation.
        run: npm test -- --config=jest-clinical.config.js --coverage --coverageDirectory=coverage
      - name: Subir cobertura a Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint check (archivos JavaScript modificados en el PR)
        shell: bash
        run: |
          git fetch origin main --depth=1
          changed_files="$(git diff --name-only origin/main...HEAD | grep -E '^Frontend/.*\.(js|jsx)$' | sed 's#^Frontend/##' || true)"
          if [ -z "$changed_files" ]; then
            echo "No hay archivos JavaScript/JSX modificados en Frontend."
            exit 0
          fi
          printf '%s\n' "$changed_files" | xargs -r npx eslint --report-unused-disable-directives --max-warnings 0
      - name: Build check
        run: npm run build
        env:
          VITE_BACKEND_URL: https://api.basileia.com/api/v1

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5
      - name: Backend - Audit de seguridad
        working-directory: ./backend
        run: npm ci && npm audit --audit-level=moderate
      - name: Frontend - Audit de seguridad
        working-directory: ./Frontend
        run: npm ci && npm audit --audit-level=moderate

  test-summary:
    needs: [backend-tests, frontend-lint, security-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Resumen de tests
        run: |
          echo "Backend tests: ${{ needs.backend-tests.result }}"
          echo "Frontend lint/build: ${{ needs.frontend-lint.result }}"
          echo "Security audit: ${{ needs.security-audit.result }}"
          if [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-lint.result }}" != "success" ] || [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "❌ Al menos un control obligatorio falló."
            exit 1
          fi
          echo "✅ Todos los controles obligatorios pasaron."
