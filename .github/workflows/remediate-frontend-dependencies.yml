name: Remediate frontend dependencies

on:
  push:
    branches:
      - fix/clinical-assessment-measure-contract
    paths:
      - 'Frontend/package.json'
      - 'Frontend/package-lock.json'
      - '.github/workflows/remediate-frontend-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/clinical-assessment-measure-contract
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Apply available non-breaking npm security fixes
        working-directory: Frontend
        run: npm audit fix || echo "Some advisories require a major upgrade or have no upstream patch; continue to validation."

      - name: Validate clean install
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Enforce high-severity security gate
        working-directory: Frontend
        run: npm audit --audit-level=high

      - name: Commit manifest and lockfile updates
        if: always()
        run: |
          if git diff --quiet -- Frontend/package.json Frontend/package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/package.json Frontend/package-lock.json
          git commit -m "fix: remediate frontend npm vulnerabilities"
          git push origin HEAD:fix/clinical-assessment-measure-contract
