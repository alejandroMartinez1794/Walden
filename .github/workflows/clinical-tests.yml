name: Clinical Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          package-lock.json

    - name: Install dependencies
      run: |
        cd backend
        npm ci

    - name: Run unit tests
      run: |
        cd backend
        npm run test:unit -- --config=jest-clinical.config.js --ci --reporters=default --reporters=jest-junit

    - name: Run integration tests
      run: |
        cd backend
        npm run test:integration -- --config=jest-clinical.config.js --ci --reporters=default --reporters=jest-junit

    - name: Run clinical scenario tests
      run: |
        cd backend
        npm run test -- --config=jest-clinical.config.js --testPathPattern=clinical-scenarios --ci --reporters=default --reporters=jest-junit

    - name: Generate coverage report
      run: |
        cd backend
        npm run test -- --config=jest-clinical.config.js --coverage --coverageDirectory=coverage

    - name: Validate coverage thresholds
      run: |
        cd backend
        node scripts/validateCoverage.js ./coverage/coverage-final.json

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          backend/reports/
          backend/coverage/

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run security audit
      run: |
        cd backend
        npm audit --audit-level high

    - name: Run linting
      run: |
        cd backend
        npm run lint || echo "Linting issues found, please review"

  clinical-validation:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to staging
      run: echo "Deploying to staging environment for clinical validation"
      # Add deployment commands here

    - name: Run end-to-end clinical tests
      run: |
        echo "Running end-to-end clinical validation tests"
        # Add e2e tests here
